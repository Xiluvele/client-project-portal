name: API CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/api-ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/LethaboPortal.Api/LethaboPortal.Api.csproj

      - name: Build API
        run: dotnet build backend/LethaboPortal.Api/LethaboPortal.Api.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test backend/LethaboPortal.Api.Tests/LethaboPortal.Api.Tests.csproj --configuration Release

      - name: Publish API
        run: dotnet publish backend/LethaboPortal.Api/LethaboPortal.Api.csproj --configuration Release --no-restore --output ./publish

      - name: Upload published API
        uses: actions/upload-artifact@v4
        with:
          name: lethabo-api
          path: ./publish
