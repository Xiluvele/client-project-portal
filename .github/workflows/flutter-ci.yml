name: Flutter Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-ci.yml"

  workflow_dispatch:

jobs:
  flutter-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/lethabo_portal_mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
        if: hashFiles('mobile/lethabo_portal_mobile/test/**') != ''

      - name: Build Android Debug APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: lethabo-flutter-debug-apk
          path: mobile/lethabo_portal_mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
